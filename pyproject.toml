[project]
name = "ai-video-factory"
version = "0.1.0"
description = "Local AI video factory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.27,<0.28",
    "pydantic>=2.12,<3",
    "Pillow>=10",
    "numpy>=1.26,<3",
    "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.scripts]
ai-video-factory = "ai_video_factory.cli:app"

[project.optional-dependencies]
youtube = [
    "google-api-python-client>=2.0,<3",
    "google-auth-oauthlib>=1.2,<2",
]
whisper = [
    "openai-whisper>=20240930",
]
ui = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_video_factory"]
